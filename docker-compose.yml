# Docker Compose for local development.
#
# Milestone 1 runs only the backend. We use a managed Postgres (Neon) rather
# than a local Postgres container, which keeps resource usage low on modest
# machines. If you later want a fully-local DB, we can add a `db` service
# with the pgvector image -- that is a documented option, not the default.

services:
  backend:
    build:
      context: ./backend
    image: nexus-ai-backend:dev
    container_name: nexus-backend
    env_file:
      - .env
    environment:
      # Ensure the container binds correctly regardless of .env.
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
