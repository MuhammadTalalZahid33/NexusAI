# Docker Compose for the full Nexus AI stack (local / demo).
#
# Uses a managed Postgres (Neon) via DATABASE_URL rather than a local DB
# container, keeping resource use low. If you prefer a fully-local DB, add a
# `db` service using the `pgvector/pgvector:pg16` image and point DATABASE_URL
# at it -- a documented option, not the default.

services:
  backend:
    build:
      context: ./backend
    image: nexus-ai-backend:dev
    container_name: nexus-backend
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Point the built SPA at the backend. For a real deploy, set this to
        # the public backend URL.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: nexus-ai-frontend:dev
    container_name: nexus-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
