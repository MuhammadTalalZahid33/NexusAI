[project]
name = "nexus-ai-backend"
version = "0.1.0"
description = "Nexus AI - Agentic RAG knowledge intelligence platform (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4",
    "sqlalchemy>=2.0,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "tiktoken>=0.8",
    "google-genai>=1.0",
    "cohere>=5.13",
    "langgraph>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/File() in argument defaults is the required pattern.
# UP042: str+Enum is intentional for SQLAlchemy enum compatibility.
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
